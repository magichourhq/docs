name: creative-integrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/vercel-ai-sdk/**
      - examples/figma/**
      - examples/langflow/**
      - examples/design-video/**
      - .github/workflows/creative-integrations.yml
  pull_request:
    paths:
      - examples/vercel-ai-sdk/**
      - examples/figma/**
      - examples/langflow/**
      - examples/design-video/**
      - .github/workflows/creative-integrations.yml
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: examples/vercel-ai-sdk
      - run: npm run check && npm test && npm run build && npm pack --dry-run
        working-directory: examples/vercel-ai-sdk
      - run: npm ci
        working-directory: examples/figma
      - run: npm run check && npm run build && npm test
        working-directory: examples/figma
      - run: npx playwright install --with-deps chromium
        working-directory: examples/figma
      - run: npm run test:ui
        working-directory: examples/figma
  langflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: examples/langflow
      - run: pytest -q tests && ruff check magic_hour.py example.py tests
        working-directory: examples/langflow
  design-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: examples/design-video
      - run: npm run check && npm test && npm run build
        working-directory: examples/design-video
      - run: npx playwright install --with-deps chromium
        working-directory: examples/design-video
      - run: npm run test:ui
        working-directory: examples/design-video
